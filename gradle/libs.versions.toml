[versions]
agp = "8.12.2"
kotlin = "2.2.10"

# Legacy-compat matrix (Android 4.3 / API 18 port).
# Every androidx artifact here must keep its minSdk floor <= 18.
# Extension runtime surface: ALL current extensions load `echo.common` classes +
# `okhttp3` from the app classloader — common/okhttp/protobuf versions are pinned.
room = "2.6.1"
koinAndroid = "3.5.6"
paging = "3.2.1"
exooplayer2 = "2.19.1"
glide = "4.16.0"

[libraries]
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "5.1.0" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.9.0" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version = "1.10.2" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }

androidx-core-google-shortcuts = { module = "androidx.core:core-google-shortcuts", version = "1.1.0" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.9.0" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version = "1.6.1" }
androidx-cardview = { module = "androidx.cardview:cardview", version = "1.0.0" }
androidx-coordinatorlayout = { module = "androidx.coordinatorlayout:coordinatorlayout", version = "1.2.0" }
androidx-activity = { group = "androidx.activity", name = "activity-ktx", version = "1.8.2" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version = "1.0.0" }
conscrypt = { module = "org.conscrypt:conscrypt-android", version = "2.5.2" }
androidx-multidex = { module = "androidx.multidex:multidex", version = "2.0.1" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version = "2.1.5" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version = "2.6.1" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version = "2.6.1" }
androidx-navigation-fragment = { module = "androidx.navigation:navigation-fragment-ktx", version = "2.5.3" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version = "2.8.1" }
androidx-paging-common = { module = "androidx.paging:paging-common-ktx", version.ref = "paging" }
androidx-paging-runtime = { module = "androidx.paging:paging-runtime-ktx", version.ref = "paging" }

protobuf-java = { module = "com.google.protobuf:protobuf-java", version = "4.32.0" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version = "1.2.1" }
swiperefresh = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version = "1.1.0" }

fragment = { module = "androidx.fragment:fragment-ktx", version = "1.5.7" }

palette = { module = "androidx.palette:palette-ktx", version = "1.0.0" }

legacy-support-media = { module = "androidx.media:media", version = "1.2.1" }
legacy-preference = { module = "androidx.preference:preference-ktx", version = "1.2.1" }
legacy-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version = "2.1.4" }

filekache = { module = "com.mayakapps.kache:file-kache", version = "2.1.1" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

koin-android = { module = "io.insert-koin:koin-android", version.ref = "koinAndroid" }
koin-androidx-workmanager = { module = "io.insert-koin:koin-androidx-workmanager", version.ref = "koinAndroid" }

exoplayer2 = { module = "com.google.android.exoplayer:exoplayer", version.ref = "exooplayer2" }
exoplayer2-media = { module = "androidx.media:media", version = "1.2.1" }

glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }

pikolo = { module = "com.github.madrapps:pikolo", version = "2.0.2" }
fadingedgelayout = { module = "com.github.bosphere.android-fadingedgelayout:fadingedgelayout", version = "1.0.0" }
kenburnsview = { module = "com.flaviofaria:kenburnsview", version = "1.0.7" }

[bundles]
androidx = [
    "androidx-core-ktx", "androidx-appcompat", "androidx-cardview", "androidx-coordinatorlayout",
    "androidx-activity", "fragment",
    "recyclerview", "swiperefresh", "palette", "legacy-preference",
    "legacy-constraintlayout", "androidx-multidex", "legacy-support-media",
    "androidx-core-google-shortcuts", "androidx-lifecycle-runtime", "androidx-lifecycle-viewmodel",
    "androidx-navigation-fragment", "androidx-work-runtime", "androidx-viewpager2",
    "androidx-paging-common", "androidx-paging-runtime"
]
room = ["room-runtime", "room-ktx"]
koin = ["koin-android", "koin-androidx-workmanager"]
exoplayer = ["exoplayer2", "exoplayer2-media"]
glide = ["glide"]
kotlinx = ["kotlinx-serialization-json", "kotlinx-coroutines-core"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
